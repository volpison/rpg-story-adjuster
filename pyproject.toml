[project]
name = "rpg-story-adjuster"
version = "0.1.0"
description = "Read, scan, and reassign switch/variable IDs in RPG Maker MZ projects"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
rpg-story-adjuster = "rpg_story_adjuster.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rpg_story_adjuster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
